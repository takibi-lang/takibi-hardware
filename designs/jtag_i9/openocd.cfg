# OpenOCD for the Colorlight i9 through the ext board's DAPLink (issue #10).
# The DAPLink is CMSIS-DAP v1 (HID only). In the devcontainer there are no
# /dev/hidraw nodes, so OpenOCD's hidraw backend finds nothing: run it
# with LD_PRELOAD=.../libhidapi-libusb.so.0 (as `make jtag-test` does),
# the libusb backend that openFPGALoader uses too.
adapter driver cmsis-dap
cmsis-dap vid_pid 0x0d28 0x0204
transport select jtag
adapter speed 1000
jtag newtap ecp5 tap -irlen 8 -expected-id 0x41112043
init
